<!doctype html><meta charset="utf-8"><title>Soundtrack integration check</title>
<button id="start">Test supplied soundtrack</button><pre id="result">Ready</pre>
<script type="module">
import {LoopingMusic} from '/src/game/music.ts';
const button=document.querySelector('button'),result=document.querySelector('pre');
button.onclick=async()=>{button.disabled=true;try{
 const context=new AudioContext();await context.resume();
 const buffers=await Promise.all(['going-under-remastered.mp3','8bit-stranger-things.mp3'].map(async file=>{const response=await fetch('/audio/'+file);if(!response.ok)throw Error('MP3 HTTP '+response.status);const buffer=await context.decodeAudioData(await response.arrayBuffer());if(buffer.duration<10)throw Error('Invalid audio');return buffer;}));
 const output=context.createGain();output.gain.value=0;output.connect(context.destination);
 const shorts=buffers.map(buffer=>{const short=context.createBuffer(buffer.numberOfChannels,context.sampleRate*2,context.sampleRate);for(let c=0;c<buffer.numberOfChannels;c++)short.copyToChannel(buffer.getChannelData(c).subarray(0,short.length),c);return short;});
 const music=new LoopingMusic(context,output,shorts);music.start();
 await new Promise(r=>setTimeout(r,4800));music.start(true,1);await new Promise(r=>setTimeout(r,600));music.stop();
 await new Promise(r=>setTimeout(r,500));await context.close();
 result.textContent='PASS: both supplied MP3s decoded ('+buffers.map(b=>b.duration.toFixed(2)+' seconds').join(', ')+'); real audio engine alternated both tracks, selected track 2, restarted and faded out without errors.';
 }catch(e){result.textContent='FAIL: '+e.stack;}};
</script>
