<!doctype html><meta charset="utf-8"><title>Soundtrack integration check</title>
<button id="start">Test supplied soundtrack</button><pre id="result">Ready</pre>
<script type="module">
import {LazyLoopingMusic} from '/src/game/music.ts';
import {MUSIC_TRACKS} from '/src/game/audio.ts';
const button=document.querySelector('button'),result=document.querySelector('pre');
button.onclick=async()=>{button.disabled=true;let context;try{
 context=new AudioContext();await context.resume();const clips=[],durations=[];
 for(const track of MUSIC_TRACKS){const response=await fetch('/audio/'+track.file);if(!response.ok)throw Error('Audio HTTP '+response.status);const buffer=await context.decodeAudioData(await response.arrayBuffer());if(buffer.duration<10)throw Error('Invalid audio '+track.title);durations.push(track.title+' / '+buffer.duration.toFixed(1)+'s');const clip=context.createBuffer(buffer.numberOfChannels,Math.floor(context.sampleRate*.4),context.sampleRate);for(let c=0;c<buffer.numberOfChannels;c++)clip.copyToChannel(buffer.getChannelData(c).subarray(0,clip.length),c);clips.push(clip);result.textContent='Decoded '+clips.length+'/'+MUSIC_TRACKS.length;}
 const output=context.createGain();output.gain.value=0;output.connect(context.destination);const loaded=[];
 const music=new LazyLoopingMusic(context,output,clips.length,async index=>{loaded.push(index);return clips[index];});music.start(false,7);
 await new Promise(r=>setTimeout(r,2800));if(loaded[0]!==7||loaded[1]!==0||!loaded.includes(6)||loaded.filter(i=>i===7).length<2)throw Error('Eight-track loop did not wrap');music.start(true,5);await new Promise(r=>setTimeout(r,100));if(music.currentTrack!==5)throw Error('Selection restart');music.stop();await new Promise(r=>setTimeout(r,500));
 result.textContent='PASS: all eight MP3/M4A recordings decoded; lazy playlist wrapped last → first, selected/restarted and faded.\n'+durations.join('\n');document.title='PASS eight soundtrack files';
 }catch(e){result.textContent='FAIL: '+e.stack;document.title='FAIL soundtrack';}finally{if(context)await context.close();}};
</script>
